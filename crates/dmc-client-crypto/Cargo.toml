[package]
name = "dmc-client-crypto"
version.workspace = true
edition.workspace = true
description = "CLIENT_OWNED cryptography for AvroraClient: device-held keys, HPKE key envelopes, client-side sealing. Never linked into the database server."

[dependencies]
dmc-vault = { path = "../dmc-vault" }
ed25519-dalek = "2"
hex = "0.4"
hkdf = "0.12"
hpke = { version = "0.12", default-features = false, features = ["x25519", "alloc"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
