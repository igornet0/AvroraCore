[package]
name = "dmc-journal"
version.workspace = true
edition.workspace = true

[dependencies]
ciborium = "0.2"
crc32c = "0.6"
dmc-vault = { path = "../dmc-vault" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
