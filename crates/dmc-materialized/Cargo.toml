[package]
name = "dmc-materialized"
version.workspace = true
edition.workspace = true
description = "Phase 6.11 — journal-backed materialized catalog + row state"

[dependencies]
dmc-model = { path = "../dmc-model" }
dmc-storage = { path = "../dmc-storage" }
dmc-security = { path = "../dmc-security" }
dmc-vault = { path = "../dmc-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
tempfile = "3"
dmc-journal = { path = "../dmc-journal" }
