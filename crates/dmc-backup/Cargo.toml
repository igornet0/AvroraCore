[package]
name = "dmc-backup"
version.workspace = true
edition.workspace = true
description = "Phase 7.8 — Backup, restore, recovery/rebuild"

[dependencies]
dmc-materialized = { path = "../dmc-materialized" }
dmc-model = { path = "../dmc-model" }
dmc-storage = { path = "../dmc-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
dmc-sql-exec = { path = "../dmc-sql-exec" }
dmc-sql-bind = { path = "../dmc-sql-bind" }
dmc-sql-plan = { path = "../dmc-sql-plan" }
dmc-sql-phys = { path = "../dmc-sql-phys" }
dmc-security = { path = "../dmc-security" }
dmc-vault = { path = "../dmc-vault" }
