[package]
name = "dmc-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "avrora"
path = "src/bin/avrora.rs"

[dependencies]
avrora-proto = { path = "../../../AvroraClient/crates/avrora-proto" }
backupsas-client = { path = "../../../BackupSAS/crates/backupsas-client" }
backupsas-core = { path = "../../../BackupSAS/crates/backupsas-core" }
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ciborium = "0.2"
dialoguer = "0.11"
dmc-journal = { path = "../dmc-journal" }
dmc-protocol = { path = "../dmc-protocol" }
dmc-runtime = { path = "../dmc-runtime" }
dmc-security = { path = "../dmc-security" }
dmc-ipc = { path = "../dmc-ipc" }
dmc-server = { path = "../dmc-server" }
dmc-storage = { path = "../dmc-storage" }
dmc-vault = { path = "../dmc-vault" }
aes-gcm = "0.10"
ed25519-dalek = "2"
hex = "0.4"
rand = "0.8"
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.17"
zeroize = "1"

[dev-dependencies]
backupsas-server = { path = "../../../BackupSAS/crates/backupsas-server" }
dmc-client-crypto = { path = "../dmc-client-crypto" }
backupsas-storage = { path = "../../../BackupSAS/crates/backupsas-storage" }
avrora-client = { path = "../../../AvroraClient/crates/avrora-client" }
tempfile = "3"
totp-rs = { version = "6.0.0", features = ["otpauth", "gen_secret"] }
