[package]
name = "dmc-client"
version.workspace = true
edition.workspace = true
description = "Phase 7.7 — thin DataClient SDK over dmc-protocol / IPC / TLS"

[dependencies]
dmc-ipc = { path = "../dmc-ipc" }
dmc-protocol = { path = "../dmc-protocol" }
dmc-remote = { path = "../dmc-remote" }
dmc-server = { path = "../dmc-server" }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", features = ["x509-parser"] }
time = { version = "0.3", features = ["macros"] }
