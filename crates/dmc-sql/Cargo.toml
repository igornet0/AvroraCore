[package]
name = "dmc-sql"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dmc-storage = { path = "../dmc-storage" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.54"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
