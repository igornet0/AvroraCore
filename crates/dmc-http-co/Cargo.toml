[package]
name = "dmc-http-co"
version.workspace = true
edition.workspace = true
description = "CLIENT_OWNED HTTP adapter: loopback-only thin transport over CoreServerState (D3). No crypto beyond public-key signature checks done in dmc-security."

[dependencies]
axum = "0.8"
dmc-protocol = { path = "../dmc-protocol" }
dmc-security = { path = "../dmc-security" }
dmc-server = { path = "../dmc-server" }
dmc-vault = { path = "../dmc-vault" }
hex = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
