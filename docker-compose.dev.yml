# AvroraCore DEV stack — fixed secrets from docker/env.dev
#
#   make -f Makefile.docker up-dev
#   make -f Makefile.docker down-dev

name: avrora-core-dev

services:
  avrora:
    image: ${AVRORA_IMAGE:-avrora-core:local}
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        client: ../AvroraClient
      args:
        RUST_VERSION: ${RUST_VERSION:-1.88}
        NODE_VERSION: ${NODE_VERSION:-22}
    container_name: avrora-core-dev
    restart: unless-stopped
    env_file:
      - ./docker/env.dev
    environment:
      AVRORA_DEV: "1"
      AVRORA_UI_DIST: /usr/local/share/avrora/ui
    ports:
      - "${AVRORA_HTTP_PORT:-18787}:18787"
      - "${AVRORA_CONTROL_PORT:-7432}:7432"
    volumes:
      - avrora-dev-data:/var/lib/avrora
    command: ["avrora"]
    healthcheck:
      test: ["CMD", "avrora", "status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  sql:
    image: ${AVRORA_IMAGE:-avrora-core:local}
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        client: ../AvroraClient
      args:
        RUST_VERSION: ${RUST_VERSION:-1.88}
        NODE_VERSION: ${NODE_VERSION:-22}
    container_name: avrora-sql-dev
    restart: unless-stopped
    depends_on:
      avrora:
        condition: service_started
    env_file:
      - ./docker/env.dev
    environment:
      AVRORA_DEV: "1"
    ports:
      - "${SQL_PORT:-15432}:15432"
    volumes:
      - avrora-dev-data:/var/lib/avrora
    command: ["sql"]

volumes:
  avrora-dev-data:
    name: avrora-core-dev-data
