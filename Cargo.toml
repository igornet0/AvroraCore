[workspace.package]
name = "avrora-core"
version = "0.1.0"
edition = "2024"
description = "Avrora Core — ядро высокопроизводительной СУБД с поддержкой транзакций, расширяемости и современных SQL-функций."
license = "MIT"
authors = ["Igor <igornet0@users.noreply.github.com>"]
repository = "https://github.com/igornet0/AvroraCore"
keywords = ["database", "sql", "transaction", "core", "storage", "avrora"]
categories = ["database-implementations", "data-structures", "storage"]

