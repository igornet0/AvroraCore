    "crates/dmc-core",
    "crates/dmc-security",
    "crates/dmc-vault",
    "crates/dmc-journal",
    "crates/dmc-storage",
    "crates/dmc-sql",
    "crates/dmc-pgwire",
    "crates/dmc-model",
    "crates/dmc-sql-front",
    "crates/dmc-sql-bind",
    "crates/dmc-sql-plan",
    "crates/dmc-sql-phys",
    "crates/dmc-materialized",
    "crates/dmc-sql-exec",
    "crates/dmc-protocol",
    "crates/dmc-server",
    "crates/dmc-ipc",
    "crates/dmc-remote",
    "crates/dmc-client",
    "crates/dmc-tauri",
    "crates/dmc-backup",
    "crates/dmc-observability",
    "crates/dmc-ops",
    "crates/dmc-bench",
