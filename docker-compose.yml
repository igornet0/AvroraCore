# Local AvroraCore DBMS stack
#
#   make -f Makefile.docker up
#   make -f Makefile.docker down
#
# Ports (host → container):
#   18787  HTTP admin UI
#   7432   Control Plane (TLS 1.3 / mTLS)
#   15432  SQL / PostgreSQL wire (dmc-pgwire)

name: avrora-core

services:
  avrora:
    image: ${AVRORA_IMAGE:-avrora-core:local}
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        client: ../AvroraClient
      args:
        RUST_VERSION: ${RUST_VERSION:-1.88}
        NODE_VERSION: ${NODE_VERSION:-22}
    container_name: avrora-core
    restart: unless-stopped
    environment:
      AVRORA_HOME: /var/lib/avrora
      AVRORA_DATA: /var/lib/avrora/avrora.dbs.json
      AVRORA_CONTROL_DIR: /var/lib/avrora/control
      AVRORA_ADDR: 0.0.0.0:18787
      AVRORA_CONTROL_ADDR: 0.0.0.0:7432
      AVRORA_UI_DIST: /usr/local/share/avrora/ui
      INVITE_HOST: ${INVITE_HOST:-127.0.0.1}
      INVITE_PORT: ${INVITE_PORT:-7432}
    ports:
      - "${AVRORA_HTTP_PORT:-18787}:18787"
      - "${AVRORA_CONTROL_PORT:-7432}:7432"
    volumes:
      - avrora-data:/var/lib/avrora
    command: ["avrora"]
    healthcheck:
      test: ["CMD", "avrora", "status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  sql:
    image: ${AVRORA_IMAGE:-avrora-core:local}
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        client: ../AvroraClient
      args:
        RUST_VERSION: ${RUST_VERSION:-1.88}
        NODE_VERSION: ${NODE_VERSION:-22}
    container_name: avrora-sql
    restart: unless-stopped
    depends_on:
      avrora:
        condition: service_started
    environment:
      AVRORA_HOME: /var/lib/avrora
      SQL_DATA: /var/lib/avrora/sql.dbs.json
      SQL_MASTER_KEY: /var/lib/avrora/sql.master.key
      SQL_ADDR: 0.0.0.0:15432
    ports:
      - "${SQL_PORT:-15432}:15432"
    volumes:
      - avrora-data:/var/lib/avrora
    command: ["sql"]

volumes:
  avrora-data:
    name: avrora-core-data
